<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目讨论</title>
  <style>
:root { --bg:#fbf7ef; --ink:#2f2a24; --muted:#7c6f62; --incoming:#fffaf2; --outgoing:#efe3cf; }
body { margin:0; font-family:"Source Han Serif SC","Noto Serif SC",serif; background: radial-gradient(circle at top,#fff,#f3e8d7); color:var(--ink); }
.chat { max-width: 860px; margin:0 auto; min-height:100vh; background: var(--bg); border-left:1px solid #e7dcc9; border-right:1px solid #e7dcc9; }
.header { padding:14px 18px; border-bottom:1px solid #e7dcc9; }
.timeline { padding:18px; }
.msg{display:grid;grid-template-columns:44px 1fr;gap:10px;margin-bottom:14px}.msg.self{grid-template-columns:1fr 44px}
.avatar-btn{border:none;padding:0;background:transparent;cursor:pointer;width:44px;height:44px;border-radius:2px}
.msg-main{width:fit-content;max-width:78%}.msg.self .msg-main{margin-left:auto}.meta{font-size:12px;color:var(--muted)}.msg.self .meta{text-align:right}
.bubble{display:inline-block;max-width:100%;padding:10px 12px;border-radius:4px;background:var(--incoming);border:1px solid #e4d7c1;white-space:pre-wrap}.msg.self .bubble{background:var(--outgoing)}
.bubble.media{padding:4px;background:transparent;border:none}
.recall-tip{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.quote{padding:6px 8px;margin-bottom:8px;border-left:2px solid #a48a6f;background:#f8efdf;font-size:12px}
.avatar{width:44px;height:44px;border-radius:2px;object-fit:cover;background:#ddd}
.img{max-width:min(320px,100%);display:block;border:1px solid #dac8ac}
.img-caption{margin-top:6px;font-size:13px;line-height:1.4}
.voice-btn{border:none;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
.voice-icon{font-size:12px;color:#3b3b3b}.voice-duration{font-size:13px;color:#3b3b3b;min-width:26px;text-align:left}.voice-btn.playing .voice-icon{color:#5f513f}
.card{display:block;padding:8px;border:1px solid #dac8ac;background:#fff4e3;text-decoration:none;color:inherit}
.card-title{font-weight:700}.card-desc,.card-footer{font-size:12px;color:var(--muted)}
.article-card{border:1px solid #dac8ac;display:block;width:100%;text-align:left;cursor:pointer;padding:8px;background:#fff4e3;border-radius:4px}
.article-title{font-size:14px;font-weight:700;line-height:1.4}.article-meta{margin-top:4px;font-size:11px;color:var(--muted)}
.article-cover{width:100%;margin-top:8px;border:1px solid #dac8ac;max-height:150px;object-fit:cover}.article-summary{margin-top:7px;font-size:12px;color:#4c4c4c;line-height:1.45}
.contact-card{padding:9px;border:1px solid #dac8ac;background:#fff4e3;border-radius:4px;display:flex;gap:9px;align-items:center}
.contact-avatar{width:42px;height:42px;border-radius:4px;object-fit:cover;background:#ddd}.contact-name{font-size:14px;font-weight:700}
.contact-nick{margin-top:2px;font-size:11px;color:var(--muted)}.contact-bio{margin-top:6px;font-size:12px;color:#4c4c4c;line-height:1.35}
.mention{color:#6b5842;font-weight:700}
.profile-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.35);z-index:20}
.profile-modal.show{display:flex}
.profile-card{width:min(320px,100%);background:#fffef9;border-radius:8px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.2);border:1px solid #e4d7c1}
.profile-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}.profile-avatar{width:50px;height:50px;border-radius:4px;object-fit:cover;background:#ddd}
.profile-name{font-size:16px;font-weight:700}.profile-item{font-size:13px;color:#444;line-height:1.45;margin-top:4px;word-break:break-word}
.profile-close{margin-top:12px;width:100%;border:1px solid #dac8ac;border-radius:6px;background:#f8efdf;padding:8px 0;cursor:pointer}
.article-modal{position:fixed;inset:0;background:#fffef9;z-index:30;display:none;overflow-y:auto}
.article-modal.show{display:block}.article-header{position:sticky;top:0;background:#fffef9;border-bottom:1px solid #e4d7c1;height:46px;display:flex;align-items:center;padding:0 10px}
.article-back{border:none;background:transparent;font-size:14px;color:#444;cursor:pointer;padding:6px 8px}
.article-body{padding:14px 14px 30px}.article-page-title{font-size:24px;font-weight:700;line-height:1.35;margin:0}
.article-page-sub{margin-top:8px;font-size:12px;color:#8f8f8f}.article-page-cover{width:100%;border:1px solid #dac8ac;margin-top:12px}
.article-page-text{margin-top:14px;font-size:16px;line-height:1.8;color:#222;white-space:pre-wrap;word-break:break-word}
.article-page-images{margin-top:12px;display:grid;gap:8px}.article-page-images img{width:100%;border:1px solid #dac8ac;background:#ddd}
</style>
</head>
<body>
  <main class="chat">
    <header class="header">
      <h1>项目讨论</h1>
      <p>群聊 · 项目讨论</p>
    </header>
    <section class="timeline">
      <article class="msg self"><div class="msg-main"><p class="meta">Alice · 2026-04-09 10:00</p><div class="bubble"><div>Paper 主题用于展示可扩展样式能力。</div></div></div><button class="avatar-btn" type="button"
      data-user-id="alice"
      data-display-name="Alice"
      data-avatar="https://picsum.photos/seed/alice/100/100">
      <img class="avatar" src="https://picsum.photos/seed/alice/100/100" alt="Alice"/>
    </button></article>
<article class="msg"><button class="avatar-btn" type="button"
      data-user-id="bob"
      data-display-name="Bob"
      data-avatar="https://picsum.photos/seed/bob/100/100">
      <img class="avatar" src="https://picsum.photos/seed/bob/100/100" alt="Bob"/>
    </button><div class="msg-main"><p class="meta">Bob · 2026-04-09 10:02</p><div class="bubble"><a class="card" href="https://example.com/spec" target="_blank" rel="noreferrer">
      <div class="card-title">example.com</div>
      <div class="card-desc">https://example.com/spec</div>
      <div class="card-footer"><span>example.com</span><span>链接卡片</span></div>
    </a></div></div></article>
<article class="msg"><button class="avatar-btn" type="button"
      data-user-id="clara"
      data-display-name="Clara"
      data-avatar="https://picsum.photos/seed/clara/100/100">
      <img class="avatar" src="https://picsum.photos/seed/clara/100/100" alt="Clara"/>
    </button><div class="msg-main"><p class="meta">Clara · 2026-04-09 10:03</p><div class="bubble"><div class="quote"><div>Bob · 2026-04-09 10:02</div><div>[链接] example.com</div></div><div>这条是引用效果，主题切换后结构不变。</div></div></div></article>
    </section>
  </main>
  <aside id="profile-modal" class="profile-modal" aria-hidden="true">
    <div class="profile-card">
      <div class="profile-head">
        <img id="profile-avatar" class="profile-avatar" src="" alt="avatar" />
        <div id="profile-name" class="profile-name"></div>
      </div>
      <div id="profile-wechat" class="profile-item"></div>
      <div id="profile-bio" class="profile-item"></div>
      <button id="profile-close" class="profile-close" type="button">关闭</button>
    </div>
  </aside>
  <aside id="article-modal" class="article-modal" aria-hidden="true">
    <header class="article-header">
      <button id="article-back" class="article-back" type="button">返回</button>
    </header>
    <div class="article-body">
      <h1 id="article-title" class="article-page-title"></h1>
      <div id="article-sub" class="article-page-sub"></div>
      <img id="article-cover" class="article-page-cover" src="" alt="cover"/>
      <div id="article-text" class="article-page-text"></div>
      <div id="article-images" class="article-page-images"></div>
    </div>
  </aside>
  <script>
    (() => {
      const profileUsers = {"alice":{"name":"Alice","id":"alice","avatar":"https://picsum.photos/seed/alice/100/100","bio":"产品经理","nickName":"Alice","identityTimeline":[],"aliases":{"selfInGroups":{},"contacts":{}},"moments":{},"officialArticles":[],"chatFiles":[],"groupChats":{}},"bob":{"name":"Bob","id":"bob","avatar":"https://picsum.photos/seed/bob/100/100","bio":"前端工程师","nickName":"Bob","identityTimeline":[],"aliases":{"selfInGroups":{},"contacts":{}},"moments":{},"officialArticles":[],"chatFiles":[],"groupChats":{}},"clara":{"name":"Clara","id":"clara","avatar":"https://picsum.photos/seed/clara/100/100","bio":"设计师","nickName":"Clara","identityTimeline":[],"aliases":{"selfInGroups":{},"contacts":{}},"moments":{},"officialArticles":[],"chatFiles":[],"groupChats":{}}};
      const modal = document.getElementById('profile-modal');
      const avatar = document.getElementById('profile-avatar');
      const nameEl = document.getElementById('profile-name');
      const wechatEl = document.getElementById('profile-wechat');
      const bioEl = document.getElementById('profile-bio');
      const closeBtn = document.getElementById('profile-close');
      const articleModal = document.getElementById('article-modal');
      const articleBack = document.getElementById('article-back');
      const articleTitle = document.getElementById('article-title');
      const articleSub = document.getElementById('article-sub');
      const articleCover = document.getElementById('article-cover');
      const articleText = document.getElementById('article-text');
      const articleImages = document.getElementById('article-images');
      const avatarBtns = Array.from(document.querySelectorAll('.avatar-btn'));
      const voiceBtns = Array.from(document.querySelectorAll('.voice-btn'));
      const articleBtns = Array.from(document.querySelectorAll('.article-card'));

      function parseIdentityReference(raw) {
        if (!raw) return null;
        const text = String(raw).trim();
        if (!text) return null;
        const normalized = /^d{4}-d{2}-d{2}$/.test(text)
          ? text + 'T00:00:00'
          : text.replace(' ', 'T');
        const time = new Date(normalized).getTime();
        return Number.isNaN(time) ? null : time;
      }
      function resolveActiveProfile(user, referenceTime) {
        const refMs = parseIdentityReference(referenceTime) ?? Date.now();
        let resolvedName = user?.name || user?.id || '';
        let resolvedBio = user?.bio || '';
        const timeline = Array.isArray(user?.identityTimeline) ? user.identityTimeline : [];
        timeline.forEach((entry) => {
          if (!entry || typeof entry.effectiveAtMs !== 'number' || entry.effectiveAtMs > refMs) return;
          if (entry.name !== undefined) resolvedName = entry.name;
          if (entry.bio !== undefined) resolvedBio = entry.bio;
        });
        return { name: resolvedName, bio: resolvedBio };
      }

      function openProfile(btn) {
        const userId = btn.dataset.userId || '';
        const displayName = btn.dataset.displayName || btn.dataset.nickName || '';
        const user = profileUsers[userId] || {};
        const resolved = resolveActiveProfile(user, new Date().toISOString());
        avatar.src = btn.dataset.avatar || user.avatar || '';
        nameEl.textContent = resolved.name || displayName || userId;
        wechatEl.textContent = '昵称：' + (displayName || resolved.name || '未设置');
        bioEl.textContent = '简介：' + (resolved.bio || '无');
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      }
      function closeProfile() {
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }
      function openArticle(btn) {
        const title = btn.dataset.title || '';
        const author = btn.dataset.author || '';
        const cover = btn.dataset.cover || '';
        const text = btn.dataset.text || '';
        const images = (btn.dataset.images || '').split(',').filter(Boolean);
        articleTitle.textContent = title;
        articleSub.textContent = author;
        articleCover.style.display = cover ? 'block' : 'none';
        articleCover.src = cover || '';
        articleText.textContent = text;
        articleImages.innerHTML = images.map((url) => '<img src="' + url + '" alt="image"/>').join('');
        articleModal.classList.add('show');
        articleModal.setAttribute('aria-hidden', 'false');
      }
      function closeArticle() {
        articleModal.classList.remove('show');
        articleModal.setAttribute('aria-hidden', 'true');
      }

      avatarBtns.forEach((btn) => {
        btn.addEventListener('click', () => openProfile(btn));
      });
      closeBtn.addEventListener('click', closeProfile);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeProfile();
      });
      articleBtns.forEach((btn) => {
        btn.addEventListener('click', () => openArticle(btn));
      });
      articleBack.addEventListener('click', closeArticle);

      let activeAudio = null;
      let activeBtn = null;

      function setVoiceBtnState(btn, playing) {
        if (!btn) return;
        const icon = btn.querySelector('.voice-icon');
        btn.classList.toggle('playing', !!playing);
        if (icon) icon.textContent = playing ? '▮▮' : '▶';
      }
      function clearAudioState() {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        setVoiceBtnState(activeBtn, false);
        activeBtn = null;
      }

      voiceBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const src = btn.dataset.audioUrl || '';
          if (!src) return;

          if (activeBtn === btn && activeAudio && !activeAudio.paused) {
            clearAudioState();
            return;
          }

          clearAudioState();
          const audio = new Audio(src);
          activeAudio = audio;
          activeBtn = btn;
          setVoiceBtnState(btn, true);

          audio.addEventListener('ended', clearAudioState);
          audio.play().catch(() => {
            clearAudioState();
          });
        });
      });
    })();
  </script>
</body>
</html>
