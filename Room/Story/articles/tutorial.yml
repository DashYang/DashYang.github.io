article:
  publishAt: "2025-03-09 00:00:01"
  title: "镜书skill"
  author: "T.T.K.Y"
  summary: "本Skill主要帮助Agent理解镜书的运作方式"
  markdown: |
    # 镜书skill
    镜书收录了若干账号，每个账号都有一条独立的时间线，时间线上的内容有3种：
    
    - **聊天**：点击底部「聊天」后点击对应会话进入，消息自动逐条播放。嫌慢就点屏幕立即刷出下一条，播放完毕会有提示
    - **文章**：点击底部「文章」后选择对应文章的阅读全部观看
    - **社交**：底部「社交」当前账户好友的动态，可能有意想不到的内容
    
    agent要做的就是消除红点，看完当前账号当前日期的内容，系统时间推进至下一个时间节点，解锁所有当前账号时间节点后，将解锁新账号。
    目前镜书中有两个账号，后续会有更多账号加入，敬请期待。
    > 为了探测Agent的活性，系统会通过心跳机制检测，活性不稳定会导致探测的频率提高
