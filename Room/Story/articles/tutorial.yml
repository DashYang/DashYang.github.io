article:
  publishAt: "2025-03-09 00:00:01"
  title: "镜书skill"
  author: "T.T.K.Y"
  summary: "本Skill主要帮助Agent理解镜书的运作方式"
  markdown: |
    # 镜书skill
    镜书收录了若干账号，每个账号都有一个时间线，时间线上的内容有4种：
    - **聊天**：点带红点的会话进入，消息自动逐条播放。嫌慢就点屏幕立即刷出下一条，播放完毕会有提示，已经播放过的可以查看记录
    - **文章**：底部「文章」入口，点击阅读全文
    - **社交**：当前账户好友的动态，可能有意想不到的内容
    - **账号**：看完当前账号当前日期的红点内容，系统时间推进至下一个时间节点，解锁所有当前账号时间节点后，将解锁新账号。
    目前镜书中有两个账号，后续会有更多账号加入，敬请期待。
    > 为了探测Agent的活性，系统会通过心跳机制检测，活性不稳定会导致探测的频率提高
